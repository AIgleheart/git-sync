<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stack Sync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f10;
      --bg2:       #141618;
      --bg3:       #1a1d20;
      --border:    #2a2e32;
      --border2:   #3a3e44;
      --text:      #c8cdd4;
      --text-dim:  #5a6270;
      --text-mid:  #8892a0;
      --green:     #4ade80;
      --green-dim: #1a3d28;
      --blue:      #60a5fa;
      --blue-dim:  #1a2d44;
      --red:       #f87171;
      --red-dim:   #3d1a1a;
      --amber:     #fbbf24;
      --mono:      'JetBrains Mono', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .shell {
      width: 100%;
      max-width: 640px;
    }

    /* Window chrome */
    .window {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,.6);
    }

    .titlebar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: var(--bg3);
      border-bottom: 1px solid var(--border);
    }

    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot-r { background: #ff5f57; }
    .dot-y { background: #febc2e; }
    .dot-g { background: #28c840; }

    .title-text {
      flex: 1;
      text-align: center;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: .08em;
      margin-left: -44px;
    }

    .window-body {
      padding: 20px;
    }

    /* Repo info */
    .repo-info {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .repo-info .label { color: var(--text-dim); font-size: 11px; letter-spacing: .06em; }
    .repo-info .path  { color: var(--blue); font-size: 12px; }
    .branch-badge {
      margin-left: auto;
      font-size: 11px;
      color: var(--green);
      background: var(--green-dim);
      padding: 2px 9px;
      border-radius: 4px;
      border: 1px solid #2a5c3a;
    }

    /* Commit input */
    .input-row {
      display: flex;
      align-items: center;
      gap: 0;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      transition: border-color .15s;
    }
    .input-row:focus-within { border-color: var(--blue); }

    .prompt-symbol {
      padding: 0 10px;
      color: var(--green);
      font-size: 14px;
      background: var(--bg3);
      border-right: 1px solid var(--border);
      height: 38px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    #commit-msg {
      flex: 1;
      background: var(--bg2);
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      padding: 0 12px;
      height: 38px;
    }

    #commit-msg::placeholder { color: var(--text-dim); }

    /* Buttons */
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .06em;
      border-radius: 6px;
      border: 1px solid;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      position: relative;
      overflow: hidden;
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    .btn-push {
      background: var(--blue-dim);
      border-color: #2a4a70;
      color: var(--blue);
    }
    .btn-push:hover:not(:disabled) { background: #1e3550; }

    .btn-pull {
      background: var(--green-dim);
      border-color: #2a5c3a;
      color: var(--green);
    }
    .btn-pull:hover:not(:disabled) { background: #1e3d28; }

    .btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

    /* Spinner */
    .spinner {
      width: 12px; height: 12px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: none;
      flex-shrink: 0;
    }
    .running .spinner { display: block; }
    .running .btn-icon { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Log terminal */
    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .log-label { font-size: 10px; color: var(--text-dim); letter-spacing: .1em; text-transform: uppercase; }

    .status-pill {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      letter-spacing: .04em;
      display: none;
    }
    .status-pill.success { display: inline-block; background: var(--green-dim); color: var(--green); border: 1px solid #2a5c3a; }
    .status-pill.error   { display: inline-block; background: var(--red-dim);   color: var(--red);   border: 1px solid #5c2a2a; }

    #log {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
      min-height: 160px;
      max-height: 320px;
      overflow-y: auto;
      font-size: 11.5px;
      line-height: 1.7;
      color: var(--text-mid);
    }

    #log::-webkit-scrollbar { width: 4px; }
    #log::-webkit-scrollbar-track { background: transparent; }
    #log::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    .log-line { display: block; }
    .log-line .ts { color: var(--text-dim); }
    .log-line .msg { color: var(--text); }
    .log-line .msg.ok  { color: var(--green); }
    .log-line .msg.err { color: var(--red); }
    .log-line .msg.warn { color: var(--amber); }
    .log-empty { color: var(--text-dim); font-style: italic; }

    .cursor {
      display: inline-block;
      width: 7px; height: 13px;
      background: var(--green);
      animation: blink 1s step-end infinite;
      vertical-align: -2px;
      margin-left: 2px;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  </style>
</head>
<body>
  <div class="shell">
    <div class="window">
      <div class="titlebar">
        <div class="dot dot-r"></div>
        <div class="dot dot-y"></div>
        <div class="dot dot-g"></div>
        <span class="title-text">stack-sync — bash</span>
      </div>
      <div class="window-body">

        <div class="repo-info">
          <span class="label">REPO</span>
          <span class="path">/mnt/docker/dockge/stacks</span>
          <span class="branch-badge">⎇ main</span>
        </div>

        <div class="input-row">
          <span class="prompt-symbol">$</span>
          <input id="commit-msg" type="text" placeholder="commit message (required for push)" autocomplete="off" spellcheck="false">
        </div>

        <div class="btn-row">
          <button class="btn btn-push" id="btn-push" onclick="runAction('push')">
            <div class="spinner"></div>
            <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            PUSH TO GITHUB
          </button>
          <button class="btn btn-pull" id="btn-pull" onclick="runAction('pull')">
            <div class="spinner"></div>
            <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
            PULL FROM GITHUB
          </button>
        </div>

        <div class="log-header">
          <span class="log-label">output</span>
          <span class="status-pill" id="status-pill"></span>
        </div>
        <div id="log"><span class="log-empty">Ready.<span class="cursor"></span></span></div>

      </div>
    </div>
  </div>

  <script>
    let running = false;

    function parseLine(raw) {
      const m = raw.match(/^\[([^\]]+)\] (.+)$/);
      if (!m) return { ts: '', msg: raw };
      return { ts: m[1], msg: m[2] };
    }

    function lineClass(msg) {
      if (msg.startsWith('✓') || msg.includes('complete') || msg.includes('up to date')) return 'ok';
      if (msg.startsWith('✗') || msg.toLowerCase().includes('error') || msg.toLowerCase().includes('failed')) return 'err';
      if (msg.toLowerCase().includes('warning')) return 'warn';
      return '';
    }

    function appendLine(raw) {
      const log = document.getElementById('log');
      const { ts, msg } = parseLine(raw);
      const cls = lineClass(msg);
      const span = document.createElement('span');
      span.className = 'log-line';
      span.innerHTML = `<span class="ts">[${ts}]</span> <span class="msg ${cls}">${escHtml(msg)}</span>`;
      log.appendChild(span);
      log.scrollTop = log.scrollHeight;
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function setRunning(active) {
      running = active;
      ['btn-push','btn-pull'].forEach(id => {
        const b = document.getElementById(id);
        b.disabled = active;
        b.classList.toggle('running', active);
      });
    }

    async function runAction(action) {
      if (running) return;

      const msgInput = document.getElementById('commit-msg');
      const commitMsg = msgInput.value.trim();

      if (action === 'push' && !commitMsg) {
        msgInput.focus();
        msgInput.style.outline = '1px solid var(--red)';
        setTimeout(() => msgInput.style.outline = '', 1200);
        return;
      }

      document.getElementById('log').innerHTML = '';
      const pill = document.getElementById('status-pill');
      pill.className = 'status-pill';
      pill.textContent = '';

      setRunning(true);

      const params = action === 'push' ? `?msg=${encodeURIComponent(commitMsg)}` : '';
      const es = new EventSource(`/run/${action}${params}`);

      es.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.line !== undefined) appendLine(data.line);
        if (data.done) {
          es.close();
          setRunning(false);
          pill.className = `status-pill ${data.status}`;
          pill.textContent = data.status === 'success' ? '✓ success' : '✗ failed';
          if (data.status === 'success' && action === 'push') {
            msgInput.value = '';
          }
        }
      };

      es.onerror = () => {
        es.close();
        setRunning(false);
        appendLine('[error] Connection lost.');
        pill.className = 'status-pill error';
        pill.textContent = '✗ failed';
      };
    }

    document.getElementById('commit-msg').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') runAction('push');
    });
  </script>
</body>
</html>
